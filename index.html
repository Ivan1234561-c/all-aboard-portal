<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Aboard - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <!-- Left Side: Graphic -->
        <div class="login-graphic">
            <div class="wave wave1"></div>
            <div class="wave wave2"></div>
            <div class="wave wave3"></div>
            <div class="login-graphic-content">
                <i data-lucide="ship" class="large-icon"></i>
                <h1>ALL ABOARD</h1>
                <p>Tu portal de empleado y onboarding</p>
            </div>
        </div>
        
        <!-- Right Side: Form -->
        <div class="login-form-panel">
            <div class="login-logo-mobile">
                <i data-lucide="ship"></i>
                <span>ALL ABOARD</span>
            </div>
            
            <div class="form-wrapper">
                <h2 id="formTitle">Inicia sesión en tu cuenta</h2>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" placeholder="example@allaboard.com" required>
                    </div>
                    
                    <div class="form-group">
                        <div class="label-row">
                            <label for="password">Contraseña</label>
                            <a href="#" id="forgotLink" class="forgot-link">¿Olvidaste tu contraseña?</a>
                        </div>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember">Recuérdame</label>
                    </div>
                    
                    <div id="loginError" class="error-message"></div>
                    
                    <button type="submit" class="btn btn-primary btn-full">Iniciar sesión</button>
                </form>

                <form id="recoveryForm" style="display: none;">
                    <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">Ingresa tu correo electrónico y te enviaremos un enlace para recuperar tu contraseña.</p>
                    <div class="form-group">
                        <label for="recoveryEmail">Correo electrónico</label>
                        <input type="email" id="recoveryEmail" placeholder="example@allaboard.com" required>
                    </div>
                    <div id="recoveryMessage" style="margin-bottom: 15px; font-size: 0.85rem; font-weight: 500;"></div>
                    <button type="submit" class="btn btn-primary btn-full" style="margin-bottom: 15px;">Enviar enlace</button>
                    <div style="text-align: center;">
                        <a href="#" id="backToLoginLink" class="forgot-link" style="font-weight: 500;">← Volver al inicio de sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
